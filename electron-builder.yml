appId: com.bethaniel.app
productName: Bethaniel
copyright: Copyright © 2024–2026 Bethaniel

directories:
  buildResources: build
  output: dist

files:
  - electron/dist/**/*
  - package.json
  - "!**/node_modules"
  - "!**/backend"
  - "!**/frontend"
  - "!**/scripts"
  - "!**/.git"

extraResources:
  - from: build/icon.png
    to: icon.png
  - from: scripts/llama-manifest.json
    to: llama-manifest.json
  - from: electron/resources/llama/
    to: llama/
    filter:
      - "**/*"
      - "!build"
      - "!build/**"
      - "!llama-b*"
      - "!llama-b*/**"
      - "!*.tar.gz"
      - "!*.zip"
      # macOS is built for both arches in one run, and each app gets only
      # its own engine — see mac.extraResources below.
      - "!darwin-*"
      - "!darwin-*/**"
  # Optional LanguageTool grammar server (jar + optional bundled JRE). The
  # backend degrades gracefully when this directory is empty, so shipping
  # without it is fine; drop the distribution in to enable grammar checks.
  #
  # The JRE is per arch: scripts/fetch-languagetool.mjs puts one at
  # jre-<os>-<arch>/ for every arch being built, and the entry after this one
  # picks the matching one and lands it at languagetool/jre/, which is where
  # electron/main.ts looks. An Intel Mac given the Apple Silicon Java would
  # lose its grammar checks silently, so the arch is never a build-host guess.
  - from: electron/resources/languagetool/
    to: languagetool/
    filter:
      - "**/*"
      - "!HOWTO.md"
      - "!jre"
      - "!jre/**"
      - "!jre-*"
      - "!jre-*/**"
  - from: electron/resources/languagetool/jre-${os}-${arch}/
    to: languagetool/jre/
  - from: backend/dist/
    to: backend/dist/
    filter:
      - "**/*"
  - from: backend/public/
    to: backend/public/
    filter:
      - "**/*"
  # The Hunspell dictionaries. Left out until v2.19, which meant the spell
  # pass loaded nothing in every packaged build and silently found no
  # misspellings in any language — spellcheck.ts resolves them relative to
  # backend/dist, and nothing put them beside it. ~12 MB for the five.
  - from: backend/dictionaries/
    to: backend/dictionaries/
    filter:
      - "**/*"
  # The one native module is left out here and laid in per arch below:
  # macOS builds two apps from this one node_modules, and a .node compiled
  # for the build host is wrong for the other one. scripts/build.mjs sets a
  # copy aside under native/<os>-<arch>/ for every arch it builds.
  - from: backend/node_modules/
    to: backend/node_modules/
    filter:
      - "**/*"
      - "!better-sqlite3/build/Release/*.node"
  - from: electron/resources/native/${os}-${arch}/better_sqlite3.node
    to: backend/node_modules/better-sqlite3/build/Release/better_sqlite3.node
  - from: backend/package.json
    to: backend/package.json

publish:
  provider: github
  owner: SimonGrund
  repo: bethaniel
  channel: latest
  releaseType: release

asar: true
asarUnpack:
  - "**/*.node"

afterPack: ./scripts/afterPack.cjs

mac:
  # Apple Silicon and Intel, from one electron-builder run: that is what
  # makes latest-mac.yml list both zips, and electron-updater picks the one
  # whose name carries "arm64" (or the one that does not) — the arch in the
  # file name is load-bearing for the auto-updater, not decoration. A 2018
  # MacBook that is offered an arm64-only app is told it is not compatible,
  # and Betty in the Cloud needs no local engine at all.
  artifactName: Bethaniel-mac-${arch}.${ext}
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extraResources:
    - from: electron/resources/llama/darwin-${arch}/
      to: llama/darwin-${arch}/
      filter:
        - "**/*"
        - "!llama-b*"
        - "!llama-b*/**"
        - "!*.tar.gz"
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  # Custom entitlements so the bundled JVM (LanguageTool) can run under the
  # hardened runtime; entitlementsInherit is applied to nested binaries
  # (the JRE's `java` + dylibs), which electron-builder deep-signs.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: Bethaniel-win.${ext}
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  # Left false on purpose — build/installer.nsh owns this decision so it can ask
  # the user first, and so the updater's silent uninstall never wipes models.
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

linux:
  artifactName: Bethaniel-linux.${ext}
  maintainer: hello@bethaniel.com
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office

deb:
  # Prints where the user data lives after removal; deletes nothing (postrm runs
  # as root and non-interactively — see the script for why).
  afterRemove: build/deb-postrm.sh
