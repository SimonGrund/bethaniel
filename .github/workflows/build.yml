name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon host; builds the arm64 and x64 apps in one run
            platform: mac
            artifact_name: Bethaniel-mac
          - os: windows-latest
            platform: win
            artifact_name: Bethaniel-windows
          - os: ubuntu-latest
            platform: linux
            artifact_name: Bethaniel-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux packaging deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Build & Publish
        run: node scripts/build.mjs --platform ${{ matrix.platform }} ${{ startsWith(github.ref, 'refs/tags/v') && '--publish always' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: NW8MUTPA7V

      - name: Upload artifact (mac)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/Bethaniel-mac-*.dmg
            dist/Bethaniel-mac-*.zip
          retention-days: 30

      - name: Upload artifact (windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/Bethaniel-win.exe
          retention-days: 30

      - name: Upload artifact (linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/Bethaniel-linux.AppImage
            dist/Bethaniel-linux.deb
          retention-days: 30

  # ── Make the release visible, once it is complete ──
  #
  # `needs: build` means every platform succeeded. If macOS failed to notarize,
  # this never runs, the release stays a draft, and users keep the last good
  # version rather than being offered one that is missing their installer.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks the repo out — it only makes API calls — so
          # gh has no working directory to infer the repo from. Same reason
          # cloud-sweep.yml sets it.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Every platform's updater manifest must be present before anyone is
          # told this release exists. A release missing one is worse than no
          # release: the app sees a new version, asks for a manifest that is
          # not there, and fails silently.
          missing=""
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            gh release view "$TAG" --json assets \
              --jq '.assets[].name' | grep -qx "$f" || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::$TAG is missing updater manifest(s):$missing — leaving it a draft."
            exit 1
          fi

          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG"
