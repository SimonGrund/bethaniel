name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon — matches arm64 target
            platform: mac
            artifact_name: Bethaniel-mac
          - os: windows-latest
            platform: win
            artifact_name: Bethaniel-windows
          - os: ubuntu-latest
            platform: linux
            artifact_name: Bethaniel-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux packaging deps
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y libarchive-tools rpm

      - name: Build
        run: npm run dist:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: NW8MUTPA7V

      - name: Upload artifact (mac)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/Bethaniel-*.dmg
            dist/Bethaniel-*.zip
          retention-days: 30

      - name: Upload artifact (windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.exe
          retention-days: 30

      - name: Upload artifact (linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/Bethaniel-*.AppImage
            dist/bethaniel_*.deb
          retention-days: 30

      - name: Publish to GitHub Release (mac)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Bethaniel-*.dmg
            dist/Bethaniel-*.zip

      - name: Publish to GitHub Release (windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'win'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

      - name: Publish to GitHub Release (linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Bethaniel-*.AppImage
            dist/bethaniel_*.deb
