name: Cloud maintenance sweep

# Betty in the Cloud's hourly maintenance — credential expiry, quote-table
# cleanup, and the automatic refund of credentials that expired unused.
#
# This exists because Cloudflare Cron Triggers do not fire on the account the
# Worker is deployed to. Registered, shown in the dashboard, never invoked;
# reproduced on a four-line Worker with no bindings. See
# docs/cron-investigation.md. The Worker's own `crons` entry is left in place
# for whenever that is fixed — running the sweep twice is harmless, since every
# step is a conditional UPDATE or DELETE and each credential's refund decision
# is guarded by refund_status.
#
# The refund half is not optional housekeeping: the checkout success page tells
# customers in writing that unused credit is refunded automatically. Something
# has to keep that promise.

on:
    schedule:
        # Hourly. GitHub's scheduler is best-effort and can run late under
        # load, which is fine — nothing here is time-critical to the minute.
        - cron: "17 * * * *"
    # So it can be run by hand from the Actions tab without waiting an hour.
    workflow_dispatch:

# Two sweeps at once would race on the same rows. Harmless (the guards hold),
# but there is no reason to allow it.
concurrency:
    group: cloud-sweep
    cancel-in-progress: false

env:
    WORKER: https://bethaniel-cloud.cloudwatcher.workers.dev

permissions:
    contents: read
    # To open the issue that tells a human a refund needs deciding.
    issues: write

jobs:
    sweep:
        runs-on: ubuntu-latest
        steps:
            - name: Run the maintenance sweep
              env:
                  ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
              run: |
                  set -euo pipefail

                  if [ -z "${ADMIN_TOKEN:-}" ]; then
                    echo "::error::CLOUD_ADMIN_TOKEN is not set — the sweep cannot run."
                    exit 1
                  fi

                  # --fail-with-body so a non-2xx is an error AND we still see
                  # what the Worker said. Without it a 404 (which is what a bad
                  # token returns, deliberately) would look like success.
                  response=$(curl --silent --show-error --fail-with-body \
                    --max-time 120 \
                    -X POST "$WORKER/admin/sweep" \
                    -H "Authorization: Bearer ${ADMIN_TOKEN}")

                  echo "$response"

                  # Surface the refund numbers in the run summary, so the
                  # Actions tab answers "did anyone get their money back?"
                  # without opening the logs.
                  echo "### Cloud sweep" >> "$GITHUB_STEP_SUMMARY"
                  echo '```json' >> "$GITHUB_STEP_SUMMARY"
                  echo "$response" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

                  # A sweep that reports failure has tried and failed to refund
                  # someone. Fail the run so it is visible rather than buried.
                  case "$response" in
                    *'"ok":true'*) ;;
                    *) echo "::error::Sweep did not report ok:true"; exit 1 ;;
                  esac
            - name: Raise anything waiting on a human
              env:
                  ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
                  GH_TOKEN: ${{ github.token }}
                  # gh resolves the repo from the working directory, and this
                  # job never checks the repo out — it only makes HTTP calls.
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  # Partly-used credentials are never auto-refunded — that rule
                  # is farmable — so the sweep parks them for a decision. Without
                  # this step the queue is a column value nobody reads, and the
                  # customer waits on an inbox that does not exist.
                  curl --silent --show-error --fail-with-body --max-time 60 \
                    "$WORKER/admin/refunds" \
                    -H "Authorization: Bearer ${ADMIN_TOKEN}" > reviews.json

                  count=$(jq -r '.count' reviews.json)
                  echo "$count credential(s) awaiting a refund decision"

                  existing=$(gh issue list --label refund-review --state open \
                    --json number --jq '.[0].number // empty')

                  if [ "$count" -eq 0 ]; then
                    # Close a stale issue rather than leaving it open forever —
                    # an inbox that never empties stops being read.
                    if [ -n "$existing" ]; then
                      gh issue close "$existing" --comment "Queue is empty — all refunds decided."
                    fi
                    exit 0
                  fi

                  # Built as a file, not an inline string: the body contains
                  # JSON, backticks and quotes, and every one of those is a way
                  # for a shell here to misread it.
                  {
                    echo "The sweep parked these because they were partly used: too much"
                    echo "spend to refund automatically, too little to be sure the author"
                    echo "got what they paid for. Someone has to choose."
                    echo
                    echo '```json'
                    cat reviews.json
                    echo '```'
                    echo
                    echo "Settle one with POST /admin/refund, sending the credentialId"
                    echo "and an action of either refund (moves money) or decline"
                    echo "(does not). Either clears it from the queue."
                    echo
                    echo "See docs/admin-surface.md. This issue closes itself once the"
                    echo "queue is empty."
                  } > body.md

                  if [ -n "$existing" ]; then
                    gh issue edit "$existing" --body-file body.md
                    echo "updated issue #$existing"
                  else
                    gh label create refund-review --color B60205 \
                      --description "A cloud credential is waiting on a refund decision" \
                      2>/dev/null || true
                    gh issue create --label refund-review \
                      --title "Refunds awaiting a decision" --body-file body.md
                  fi
