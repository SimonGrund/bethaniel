name: Release

# Triggered when a PR is merged to main (or any direct push to main).
# Computes the next semver, bumps package.json, commits, tags, and pushes.
# The v* tag push then triggers build.yml to produce release artifacts.
#
# Bump rules (include anywhere in a commit or PR title):
#   default  -> patch  (1.2.8 -> 1.2.9)
#   #minor   -> minor  (1.2.8 -> 1.3.0)
#   #major   -> major  (1.2.8 -> 2.0.0)
#
# REQUIRED: add a Personal Access Token (repo scope) as repository secret
# RELEASE_TOKEN. GITHUB_TOKEN cannot be used because pushes made with it
# do not trigger other workflows (e.g. build.yml).

on:
    push:
        branches:
            - main

permissions:
    contents: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    release:
        name: Bump Version & Tag
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_TOKEN }}

            - name: Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Compute next version
              id: tag
              uses: mathieudutour/github-tag-action@v6.2
              with:
                  github_token: ${{ secrets.RELEASE_TOKEN }}
                  dry_run: true
                  default_bump: patch

            - name: Bump package.json
              env:
                  VERSION: ${{ steps.tag.outputs.new_version }}
              run: |
                  node -e "
                    const fs = require('fs');
                    const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                    pkg.version = process.env.VERSION;
                    fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
                  "

            - name: Commit, tag, and push
              env:
                  NEW_TAG: ${{ steps.tag.outputs.new_tag }}
              run: |
                  git add package.json
                  git commit -m "chore: release ${NEW_TAG} [skip ci]"
                  git tag "${NEW_TAG}"
                  git push origin main
                  git push origin "${NEW_TAG}"
