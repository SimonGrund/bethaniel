name: Release

# Runs when a PR is merged into main (or anything is pushed directly).
# Computes the next semver, bumps package.json, commits, tags, and pushes.
# The v* tag push then triggers build.yml to create the release artifacts.
#
# Bump rules (put anywhere in the commit/PR title):
#   default  → patch  (1.2.8 → 1.2.9)
#   #minor   → minor  (1.2.8 → 1.3.0)
#   #major   → major  (1.2.8 → 2.0.0)
#
# ⚠️  REQUIRED SECRET: create a Personal Access Token with `repo` scope
# and add it as a repository secret named RELEASE_TOKEN.
# (GITHUB_TOKEN cannot be used here because pushes made with it
#  do not trigger other workflows such as build.yml.)

on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    release:
        name: Bump Version & Tag
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_TOKEN }}

            - name: Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            # Compute the next version without pushing the tag yet (dry_run).
            # Reads existing tags and commit messages to decide patch/minor/major.
            - name: Compute next version
              id: tag
              uses: mathieudutour/github-tag-action@v6.2
              with:
                  github_token: ${{ secrets.RELEASE_TOKEN }}
                  dry_run: true
                  default_bump: patch

            # Update only the root package.json (the one electron-builder reads).
            - name: Bump package.json
              env:
                  VERSION: ${{ steps.tag.outputs.new_version }}
              run: |
                  node -e "
                    const fs = require('fs');
                    const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                    pkg.version = process.env.VERSION;
                    fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
                  "

            # Commit the version bump, tag it, then push both.
            # [skip ci] prevents this commit from re-triggering CI or this workflow.
            # The tag push (via PAT) WILL trigger build.yml as intended.
            - name: Commit, tag, and push
              env:
                  NEW_TAG: ${{ steps.tag.outputs.new_tag }}
              run: |
                  git add package.json
                  git commit -m "chore: release ${NEW_TAG} [skip ci]"
                  git tag "${NEW_TAG}"
                  git push origin main
                  git push origin "${NEW_TAG}"
