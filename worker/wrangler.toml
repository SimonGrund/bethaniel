name = "bethaniel-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Deliberately OFF: production runs on the *.workers.dev URL.
#
# A Workers Custom Domain requires Cloudflare to be authoritative for the
# zone, and bethaniel.eu is on simply.com nameservers with Google Workspace
# mail — the mailbox the checkout failure page points customers at. A prettier
# URL is not worth risking it. Decided 9 September 2026.
#
# To change it later, four things move together: this line,
# CHECKOUT_SUCCESS_URL_BASE below, `defaultBaseUrl` in
# backend/src/modelCatalog.ts, and the live webhook endpoint's URL in the
# Stripe dashboard. Miss the Stripe one and paying customers get charged and
# receive nothing.
# routes = [{ pattern = "cloud.bethaniel.eu/*", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "bethaniel-cloud"
database_id = "5a1f9f20-d04b-47a7-9679-d637266e4859" # `wrangler d1 create bethaniel-cloud`

[[durable_objects.bindings]]
name = "CREDENTIAL_LEDGER"
class_name = "CredentialLedger"

[[durable_objects.bindings]]
name = "GLOBAL_METER"
class_name = "GlobalMeter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CredentialLedger"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GlobalMeter"]

# Per-IP limiter for /v1/quote and /v1/checkout — the two endpoints that take
# no credential yet write to D1 and call Stripe. This repo is public, so the
# URL below is too; without a limit, a loop against it exhausts the daily D1
# write quota. 30/minute is far above any real author and far below a script.
#
# namespace_id is an arbitrary label scoped to this Worker, not an account
# resource to create — changing it resets the counters.
[[unsafe.bindings]]
name = "IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["0 * * * *"] # hourly: sweep expired unused credentials

[vars]
# Non-secret tuning knobs. Secrets (PROVIDER_API_KEY, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET) are set via `wrangler secret put <NAME>` and must
# never appear here.
# OVHcloud AI Endpoints: EU-sovereign, zero data retention by default (only
# billing data is kept), and OpenAI-compatible — proxy.ts appends
# /v1/chat/completions to the base below.
#
# Qwen3.5-9B, not the Llama-3.3-70B that was here before, and not the
# Qwen3.5-397B-A17B before that. Each swap came from the same finding: for
# copy-editing, size is close to irrelevant and the money goes on nothing.
#
# Measured 8 September 2026, all four models on ONE harness at identical
# settings (one editor, one reviewer, one request at a time), four languages
# of ~100 planted errors each:
#
#                       copy edit   line edit   translation (chrF)
#   Baby Betty 4B          60%         52%           75.8
#   Big Bad Betty 9B       60%         49%           76.5
#   Llama-3.3-70B          60%         24%           78.3
#   Qwen3.5-9B             59%         52%           76.7
#
# Copy edit is a four-way tie inside one point. On LINE edit the 70B was the
# worst of the four by a wide margin — less than half the free bundled model —
# and the 9B ties the best. The 70B leads only translation, by 1.6 chrF
# overall and 5.0 on Danish, which is the one thing lost by this change.
#
# Qwen3.5-9B is a REASONING model on this endpoint: left alone it spends every
# completion token on hidden chain-of-thought and returns content: null. llm.ts
# sends reasoning_effort: "none" for models observed to do that, which is what
# makes it usable here at all — see the note there before changing it.
#
# NOTE: switching models here is not enough on its own. `wrangler dev` does
# NOT pick up [vars] edits on hot reload — restart it, or you will benchmark
# the old model while believing you changed it.
PROVIDER_MODEL = "deepseek-v4-flash"
# Translation is the one pass where size still pays, so it keeps the model the
# rest of the product no longer needs. Copy edit and line edit see no such
# gain, which is why they moved.
#
# GLM-5.2 since September 2026, replacing Llama-3.3-70B. Measured EN->DA on a
# 490-word chapter through the real two-pass pipeline, against
# deepseek-v4-flash: both kept 5/5 style-sheet-bound terms, all 14 paragraphs
# and a 1.02 length ratio, so the separation was entirely in the Danish.
#   - "bitten off more than he could chew" -> GLM "taget sig vand over
#     hovedet" (the actual Danish idiom); flash calqued it word for word.
#   - "you're cutting it fine" -> GLM "du er godt nok presset"; flash
#     "du skærer det fint", which means nothing in Danish.
#   - "threepence" -> GLM "et par skilling", period-appropriate and what the
#     style sheet ASKED for in prose; flash kept the English against an
#     explicit instruction not to.
# That last one is the point: the style sheet is what makes this better than
# a plain MT engine, and only the stronger model actually obeyed it. Flash's
# own polish pass did not repair flash's own calques either — a second pass
# does not rescue a weaker model.
#
# Costs more per token than PROVIDER_MODEL. See BASE_COST_EUR_PER_TOKEN_TRANSLATE.
PROVIDER_MODEL_TRANSLATE = "glm-5.2"
# ⚠ LOAD-BEARING, and not optional with the model above. GLM reasons by
# default. resolveUpstream defaults the translate route to "default", which
# OMITS reasoning_effort — right for Llama-3.3-70B, which has nothing to switch
# off, and fatal here: measured on this exact endpoint, GLM-5.2 with reasoning
# left on spent 4,096 output tokens to return 147 words of truncated draft and
# then an EMPTY polish. That is the same failure the note on
# PROVIDER_REASONING_EFFORT below records costing a paid line-edit run its
# every correction. With this set: 843 tokens, 7 seconds, complete output.
PROVIDER_REASONING_EFFORT_TRANSLATE = "none"
PROVIDER_API_BASE = "https://api.scaleway.ai/51f0bdd4-07bd-4027-b446-1248905c0206/v1"

# ── Switching provider ──
#
# The edit pass and the translate pass resolve independently: provider, key,
# model and reasoning setting each have a _TRANSLATE counterpart that falls
# back to the default when unset. So all three of these are valid:
#
#   one provider, one model    — set nothing below
#   one provider, two models   — PROVIDER_MODEL_TRANSLATE only (today)
#   two providers              — add the _TRANSLATE base and key
#
# The third is what a migration looks like. Moving editing to a faster
# provider while translation stays where the remaining credit is costs two
# lines here and one `wrangler secret put`.
#
# Base URLs may or may not carry /v1 — OVHcloud's does not, Scaleway's does
# (with a project id: https://api.scaleway.ai/<project-id>/v1). Either is
# accepted; see chatCompletionsUrl in src/upstream.ts.
#
# PROVIDER_API_BASE_TRANSLATE — deliberately unset. Translation runs on the
# default provider (Scaleway) as well, so OVHcloud is out of the path
# entirely. Set it, plus PROVIDER_API_KEY_TRANSLATE, only to split the two
# passes across vendors again.
# PROVIDER_REASONING_EFFORT_TRANSLATE — now SET to "none", and must stay set.
# It used to be unset because Llama had no chain-of-thought to switch off and
# resolveUpstream omits the field for the translate route. GLM-5.2 does have
# one, so the omission became a silent failure. See the note beside it above.
# and: npx wrangler secret put PROVIDER_API_KEY_TRANSLATE
# Scaleway's real rate for deepseek-v4-flash, blended at the measured mix.
#
# EUR 0.40/Mtok input, EUR 0.80/Mtok output, EUR 0.08/Mtok for input served
# from their prefix cache. A 99,000-word copy edit is 877k input and 330k
# output — 73% input — which blends to EUR 0.509/Mtok, or EUR 0.61 for the job.
#
# Replaces Llama-3.3-70B's flat EUR 0.67 rate, which was carried for a model
# nobody runs any more and was knowingly wrong, kept high so the daily ceiling
# erred early. It no longer has to err: this figure is measured.
#
# It still sets no price — pricing is flat word bands — and only feeds
# globalMeter.ts's reading of the daily ceiling in money. The cache rate is
# deliberately NOT assumed here: the system prompt repeats across chunks and
# should hit it, but assuming a discount would make the ceiling optimistic,
# and this bound is supposed to bite early rather than late.
BASE_COST_EUR_PER_TOKEN = "0.000000509"
# The translation model's rate. GLM-5.2 is NOT flat: EUR 1.80/Mtok in against
# EUR 5.50/Mtok out, so this is a blend and the blend depends on the mix. Taken
# from the app's own estimator for the pipeline as it now stands — draft,
# polish, fluency reviewer, re-polish — which is 0.86M in against 0.40M out for
# 100,000 words. Output is 32% of tokens there and the blend is EUR 2.98/Mtok.
#
# Note the direction: adding the reviewer back made the blended rate CHEAPER,
# not dearer. It is an input-heavy pass (it re-reads draft and polish together
# and answers in one short JSON line per paragraph), so it dilutes the
# expensive output side even as it raises the absolute bill.
#
# Rounded up to 3.30 for headroom, because this figure backs a spend ceiling
# and a ceiling that reads low is worse than one that reads high.
BASE_COST_EUR_PER_TOKEN_TRANSLATE = "0.000003300"
# ── Price: flat bands of words, not cost-plus ──
#
# One band of PRICE_TIER_WORDS costs PRICE_TIER_EUR_CENTS; two bands cost
# double, and so on. A 100,000-word novel and a 3,000-word story both sit in
# band one and pay the same.
#
# Cost-plus was abandoned because the costs are too small to bill. Measured
# against the app's own estimator, 100,000 words is ~1.07M tokens for a copy
# edit and ~1.61M for a translation — EUR 0.16 and EUR 0.24 on the models this
# Worker serves. That is a bill dominated by Stripe's fixed fee, and a number
# no author can predict. A band is predictable and still leaves comfortable
# margin: the dearest case, translation on the 70B, costs ~EUR 1.08 in a band
# sold for EUR 5.
#
# Note the floor this creates: band one is the minimum, so a 3,000-word short
# story pays EUR 5. That is the deliberate trade for a price anyone can work
# out in their head.
PRICE_TIER_WORDS = "100000"
PRICE_TIER_EUR_CENTS = "500"
# The enhanced language analysis reads a sample of the book, not the book, so
# it is sold per band at a fraction of an edit. Same bands, its own price.
PRICE_ENHANCE_EUR_CENTS = "200"
# Translation has its own band, dearer than an edit's. It is the one product
# that still needs a large model: GLM-5.2 plus the fluency reviewer costs about
# EUR 3.76 in provider tokens for a 100,000-word book, where the same book
# copy-edited costs cents. In the EUR 5 edit band that cleared the 3x markup on
# paper and almost nothing in practice.
#
# EUR 12 holds the policy across the whole range, which EUR 10 did not once the
# reviewer came back: 3.19x at 100,000 words and 3.29x at 200,000 (the worst
# case, being two bands of a book that nearly needs three). Two bands — any
# novel over 100,000 words — therefore cost EUR 24.
PRICE_TRANSLATE_EUR_CENTS = "1200"

# Kept for the cost model in globalMeter.ts, which still reasons in tokens.
# No longer used to compute a price.
# Company markup — 3x the blended provider cost.
MARKUP_MULTIPLIER = "3"
# Stripe's own cut, absorbed into the price rather than eaten by Bethaniel.
STRIPE_PCT_FEE = "0.015"
STRIPE_FIXED_FEE_EUR = "0.25"
# Superseded by PRICE_TIER_EUR_CENTS, which is itself the floor — band one is
# the smallest thing anyone can buy. Left in place because older deployments
# still read it; it can never bind while it sits below a band.
MIN_CHARGE_EUR_CENTS = "200"
# How much room a credential gets above the estimate that priced it. Under
# cost-plus a bigger job cost more and so bought a bigger ceiling; under band
# pricing the price is flat, so the ceiling comes from the estimate alone —
# and an estimate that runs low would otherwise strand a paid job
# mid-manuscript. The global daily ceiling still bounds total exposure.
TOKEN_BUDGET_HEADROOM = "1.5"
CREDENTIAL_EXPIRY_DAYS = "7"
# The Worker's OWN origin — it hosts /v1/success, which is where Stripe sends
# the buyer and where the bethaniel:// credential handoff happens. Must change
# in lockstep with the `routes` line at the top: point that at a real domain
# and leave this on workers.dev, and every paid checkout dead-ends on a page
# the deployed Worker no longer answers.
CHECKOUT_SUCCESS_URL_BASE = "https://bethaniel-cloud.cloudwatcher.workers.dev"

# Fail-closed switch on real money. An sk_live_ key is refused unless this is
# the exact string "true" — see assertPaymentsAllowed in src/stripe.ts. Flip it
# in the same commit that swaps the key, never before.
ALLOW_LIVE_PAYMENTS = "true"

# ── Safety limits ──
# OVHcloud offers budget *alerts* but no hard spending cap, and an
# authenticated key may send 400 requests/minute per project per model —
# roughly EUR 187/hour at a representative Bethaniel chunk. These are
# therefore the only real ceilings that exist. See src/globalMeter.ts.
#
# Worker-wide tokens per UTC day (~EUR 10 of upstream cost at the flat rate
# above — it was ~EUR 23 on the old, dearer model; the token ceiling is left
# where it was, so the euro exposure simply halved). Cloud jobs are forced to the Speed preset server-side
# (cloudRunKnobs in backend/src/cloudEstimate.ts), so the largest single job
# is bounded: a 400k-word manuscript is 4.98M tokens. This leaves room for
# ~3 of those in a day, or a dozen ordinary 100k-word ones.
#
# Must stay at or above MAX_QUOTE_TOKENS, or we could sell a job we then
# refuse to run — /v1/quote enforces that relationship at runtime rather than
# trusting this comment.
#
# A value of 0 or an unparseable one fails CLOSED (every request refused),
# never open.
DAILY_TOKEN_CEILING = "15000000"
# No single call may reserve or generate more than this, whatever it asks for.
MAX_OUTPUT_TOKENS_PER_REQUEST = "8192"
# Upper bound on an unauthenticated /v1/quote, so nobody can mint a Checkout
# Session for an absurd sum. 8M is ~1.6x the largest job anyone can actually
# buy (a 400k-word manuscript at Speed, 4.98M). An anti-nonsense bound, not a
# product limit — real jobs must never reach it.
MAX_QUOTE_TOKENS = "8000000"

# Worker-wide requests per minute, across every customer.
#
# DAILY_TOKEN_CEILING bounds what Bethaniel spends; this bounds how fast it
# asks. Different failures: one customer running a full book at 24 chapters
# at once can saturate the provider for everybody else long before the day's
# tokens run out, and a per-credential limit cannot see that.
#
# 1500 allows roughly six concurrent full-speed jobs (24 chapters at ~3 calls
# per chunk settles near 72/min sustained with a burst on top). Hitting it is
# PACING, not refusal: the 429 is waited out by backend/src/llm.ts, so a busy
# minute makes every job slower rather than making one fail. Checkout never
# reaches this meter, so nobody is stopped from buying.
#
# Every minute the ceiling is reached is recorded and reported by the hourly
# sweep, which raises a GitHub issue — saturation is otherwise invisible.
WORKER_REQUESTS_PER_MINUTE = "1500"
# "none" because PROVIDER_MODEL is a Qwen model, which reasons by default and
# will otherwise burn the whole output budget thinking and return empty
# content — measured in src/proxy.ts, and measured again on 8 September 2026
# when the same behaviour reached a paid line-edit run through the direct API
# path and cost it every LLM correction.
#
# "default" omits the field, which is what a non-reasoning model wants:
# Llama-3.3-70B has no chain-of-thought to switch off, and gpt-oss rejects an
# explicit "none" with a 400. Set it back to "default" if PROVIDER_MODEL ever
# returns to a non-reasoning model.
#
# PROVIDER_MODEL_TRANSLATE is NO LONGER exempt. It was, while it was a Llama
# model sent without the field. It is GLM-5.2 now, which reasons, so it carries
# its own explicit PROVIDER_REASONING_EFFORT_TRANSLATE = "none" above.
PROVIDER_REASONING_EFFORT = "none"
